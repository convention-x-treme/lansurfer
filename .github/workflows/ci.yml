# Private repository CI uses Patrick's isolated runner; public repositories use GitHub-hosted runners for untrusted contributions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux","x64","lansurfer-ci"]' || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test PR title validator
        shell: bash
        run: bash .github/scripts/test-validate-pr-title.sh

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Check module files
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Check generated database code
        shell: bash
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          if [[ -n "$(git status --short)" ]]; then
            git status --short
            git diff
            exit 1
          fi

      - name: Run unit tests
        run: go test -race ./...

  integration:
    name: PostgreSQL integration tests
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux","x64","lansurfer-ci"]' || '"ubuntu-latest"') }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: lansurfer_test
          POSTGRES_USER: lansurfer_test
          POSTGRES_PASSWORD: lansurfer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lansurfer_test -d lansurfer_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        env:
          LANSURFER_TEST_DATABASE_URL: postgres://lansurfer_test:lansurfer_test@127.0.0.1:5432/lansurfer_test?sslmode=disable
        run: go test -race -count=1 -tags=integration ./internal/platform/postgres

  browser:
    name: Browser interaction tests
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux","x64","lansurfer-ci"]' || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        # The fixture embeds the generated CSS and JS at compile time, so the
        # bundle must match the current sources or the tests assert against a
        # stale app.ts.
        run: |
          go generate ./internal/web/branding
          go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate
          npm run build

      - name: Check generated frontend assets
        # The committed bundle is what production serves, so a stale
        # dist/ must fail here rather than drift until someone rebuilds.
        shell: bash
        run: |
          if [[ -n "$(git status --short)" ]]; then
            git status --short
            git diff
            exit 1
          fi

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser tests
        run: npx playwright test

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  build:
    name: Build and Compose smoke test
    needs: [quality, integration, browser]
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux","x64","lansurfer-ci"]' || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go build -trimpath ./...

      - name: Run Compose smoke test
        shell: bash
        run: |
          cleanup() {
            status=$?
            if [[ $status -ne 0 ]]; then
              docker compose logs
            fi
            docker compose down --volumes --remove-orphans
            exit "$status"
          }
          trap cleanup EXIT

          docker compose up --build --detach
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then
              break
            fi
            if [[ $attempt -eq 30 ]]; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/healthz | grep --fixed-strings --line-regexp ok
          curl --fail --silent http://127.0.0.1:8080/readyz | grep --fixed-strings --line-regexp ready
