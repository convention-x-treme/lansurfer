# Private repository CI uses Patrick's isolated runner; public repositories use GitHub-hosted runners for untrusted contributions.
name: Release snapshot

# No tags, publication credentials, GHCR login, or deployment in this workflow.
on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - Dockerfile.release
      - .github/workflows/release-snapshot.yml
      - .github/workflows/release.yml
      - tools/ci/**
      - scripts/release/**
      - Taskfile.yml
      - .gitignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: GoReleaser snapshot and changelog fixtures
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux","x64","docker"]' || '"ubuntu-latest"') }}
    timeout-minutes: 40
    steps:
      - name: Check out source and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU for arm64 snapshot images
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Validate and build snapshot inside GoReleaser container
        shell: bash
        run: bash tools/ci/runner.sh snapshot

      - name: Upload reviewable snapshot archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lansurfer-release-snapshot
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 7
