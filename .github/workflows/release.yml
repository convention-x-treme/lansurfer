# Private repository CI uses Patrick's isolated runner; public repositories use GitHub-hosted runners for untrusted contributions.
name: Publish release

# Only an explicit, immutable SemVer tag starts publishing. Never publish from
# pull requests, main pushes, scheduled jobs, or a workflow_dispatch action.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate source tag
    # Read-only tag checks use Docker; the privileged publisher stays hosted.
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux","x64","docker"]' || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Check out exact tagged revision and all branch refs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and source branch in a Python container
        shell: bash
        run: bash tools/ci/runner.sh validate

  test:
    name: Validate tag revision through full CI
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish GitHub Release and GHCR image
    needs: [validate, test]
    # TEMPORARY PRIVATE-REPO WORKAROUND: publish on the existing CI LXC.
    # This is NOT a security boundary against other jobs sharing its Docker daemon.
    # Issue #150 owns removing this exception on public launch.
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux","x64","docker"]' || '"ubuntu-latest"') }}
    timeout-minutes: 55
    # Serializes all tag publishers: a slower older-major backport must never
    # race a newer version when promoting vX, vX.Y and latest.
    concurrency:
      group: lansurfer-release-publisher
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out exact tagged revision and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Validate publishing tools inside Docker (no credentials)
        shell: bash
        run: bash tools/ci/runner.sh publish-check

      - name: Publish only after exact-tag CI and verify before announcing
        shell: bash
        env:
          # This token is available ONLY in the tag publisher, never in PR CI.
          # runner.sh sends it to the disposable publish container via stdin,
          # not as a Docker container environment variable or a persisted file.
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/runner.sh publish
