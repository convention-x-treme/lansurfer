# Private repository CI uses Patrick's isolated runner; public repositories use GitHub-hosted runners for untrusted contributions.
name: PR title

# Run from the trusted target branch, never from untrusted PR code.
# This job does not build, execute, or check out the PR head.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Conventional PR title
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","linux","x64","docker"]' || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Check out current trusted target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Existing PRs can still report a base.sha from before the CI tools were merged.
          # The target branch is trusted; never checkout the untrusted PR head here.
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Validate the PR title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash tools/ci/runner.sh title
