name: PR title

# Run from the trusted target branch, never from untrusted PR code.
# This job does not build, execute, or check out the PR head.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Validate the PR title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash .github/scripts/validate-pr-title.sh "$PR_TITLE"
