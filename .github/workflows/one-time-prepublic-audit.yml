# TEMPORARY: one-time private audit. Delete workflow and script before merge.
# Do not upload Gitleaks findings, raw Actions logs or downloaded artifacts.
name: One-time pre-public LANsurfer audit
on:
  pull_request:
    paths:
      - .github/workflows/one-time-prepublic-audit.yml
      - .github/scripts/one-time-prepublic-audit.py
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/89-92-prepublic-audit'
    name: Read-only one-time secret exposure audit
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out full git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all branch and tag refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' >/dev/null 2>&1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - name: Run sanitized one-time audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/one-time-prepublic-audit.py
