name: Dev container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-container-image
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push amd64 dev image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        shell: bash
        run: |
          printf '%s' "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build image
        id: image
        shell: bash
        env:
          IMAGE: ghcr.io/convention-x-treme/lansurfer
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          immutable_tag="${IMAGE}:dev-${short_sha}"
          moving_tag="${IMAGE}:dev"

          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${immutable_tag}" \
            --tag "${moving_tag}" \
            .

          echo "immutable_tag=${immutable_tag}" >> "${GITHUB_OUTPUT}"
          echo "moving_tag=${moving_tag}" >> "${GITHUB_OUTPUT}"

      - name: Push image
        shell: bash
        run: |
          docker push "${{ steps.image.outputs.immutable_tag }}"
          docker push "${{ steps.image.outputs.moving_tag }}"

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "## Dev image published"
            echo
            echo "- \`${{ steps.image.outputs.immutable_tag }}\`"
            echo "- \`${{ steps.image.outputs.moving_tag }}\`"
            echo
            echo "This is an amd64 development image only. It is not a release artifact."
          } >> "${GITHUB_STEP_SUMMARY}"
