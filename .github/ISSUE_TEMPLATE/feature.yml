name: Feature request
description: Suggest a concrete improvement to LANsurfer.
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which real user or operator problem should this solve? Issues track software development only, not event operations or release approvals.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome rather than a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: How is this handled today, and which alternatives have you considered?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I checked the product boundaries in PRODUCT.md and existing GitHub issues/milestones.
          required: true
