services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: lansurfer
      POSTGRES_USER: lansurfer
      POSTGRES_PASSWORD: lansurfer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lansurfer -d lansurfer"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "${LANSURFER_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  lansurfer:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LANSURFER_DATABASE_URL: postgres://lansurfer:lansurfer@postgres:5432/lansurfer?sslmode=disable
      LANSURFER_LISTEN_ADDR: :8080
      LANSURFER_BASE_URL: ${LANSURFER_BASE_URL:-http://localhost:8080}
      LANSURFER_TRUSTED_PROXIES: ${LANSURFER_TRUSTED_PROXIES:-}
      LANSURFER_OIDC_ISSUER: ${LANSURFER_OIDC_ISSUER:-https://auth.convention-x-treme.de/realms/local-dev}
      LANSURFER_OIDC_CLIENT_ID: ${LANSURFER_OIDC_CLIENT_ID:-lansurfer}
      LANSURFER_OIDC_CLIENT_SECRET: ${LANSURFER_OIDC_CLIENT_SECRET:-}
    init: true
    ports:
      - "${LANSURFER_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  postgres-data:
