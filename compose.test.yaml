services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: lansurfer_test
      POSTGRES_USER: lansurfer_test
      POSTGRES_PASSWORD: lansurfer_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lansurfer_test -d lansurfer_test"]
      interval: 1s
      timeout: 3s
      retries: 20
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql
