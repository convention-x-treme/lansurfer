version: 2
project_name: lansurfer

# The Git tag is the release decision. See #84 for the separate tag workflow.
builds:
  - id: lansurfer
    main: ./cmd/lansurfer
    binary: lansurfer
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: linux
    ids:
      - lansurfer
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Use local git history so older release branches do not depend on GitHub's
# cross-branch compare API. Never rewrite historical subjects for the first tag.
changelog:
  use: git
  sort: asc
  abbrev: 7
  filters:
    exclude:
      # Non-user-facing changes without the breaking-change marker.
      - '^(docs|test|ci|build|chore|refactor)(\([^)]*\))?: '
      - '^Merge pull request #'
      - '^Merge branch '
  groups:
    - title: Breaking changes
      regexp: '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([^)]*\))?!: '
      order: 0
    - title: Features
      regexp: '^feat(\([^)]*\))?: '
      order: 10
    - title: Bug fixes
      regexp: '^fix(\([^)]*\))?: '
      order: 20
    - title: Performance
      regexp: '^perf(\([^)]*\))?: '
      order: 30
    # Historical subjects that do not follow the new convention remain visible.
    - title: Other changes
      order: 999

# Only exact version tags are produced here; aliases and promotion are separate.
# GoReleaser reuses these binaries in the eventual multi-platform image.
dockers_v2:
  - id: lansurfer
    ids:
      - lansurfer
    dockerfile: Dockerfile.release
    images:
      - ghcr.io/convention-x-treme/lansurfer
    tags:
      - '{{ .Tag }}'
    platforms:
      - linux/amd64
      - linux/arm64
    annotations:
      'index,manifest:org.opencontainers.image.source': 'https://github.com/convention-x-treme/lansurfer'
      'index,manifest:org.opencontainers.image.revision': '{{ .FullCommit }}'
      'index,manifest:org.opencontainers.image.version': '{{ .Tag }}'
