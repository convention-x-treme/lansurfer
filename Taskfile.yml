version: "3"

# Optional local configuration (see .env.example). Missing file is not an error;
# variables already set in the process environment take precedence.
dotenv: [".env"]

vars:
  SQLC_VERSION: v1.31.1
  TEST_DATABASE_URL: postgres://lansurfer_test:lansurfer_test@127.0.0.1:55432/lansurfer_test?sslmode=disable

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  dev:
    desc: Build and run LANsurfer with PostgreSQL
    deps: [generate]
    cmds:
      - docker compose up --build

  run:
    desc: Run LANsurfer with configuration from the environment and optional .env
    cmds:
      - go run ./cmd/lansurfer

  build:
    desc: Build the LANsurfer binary
    deps: [frontend:build]
    cmds:
      - mkdir -p bin
      - go build -trimpath -o bin/lansurfer ./cmd/lansurfer

  test:
    desc: Run unit tests with the race detector
    cmds:
      - go test -race ./...

  test:browser:
    desc: Run browser regression tests for rapid interaction and realtime streams
    # The fixture embeds the generated assets at compile time, so the bundle has
    # to be rebuilt before the run or the tests exercise a stale app.ts.
    deps: [frontend:build]
    cmds:
      - npx playwright install --with-deps chromium
      - npx playwright test

  test:pwa:
    desc: Run the focused PWA browser suite (service-worker registration/lifecycle)
    # Same rationale as test:browser: the fixture embeds the compiled bundle,
    # including service-worker.js, at compile time.
    deps: [frontend:build]
    cmds:
      - npx playwright install --with-deps chromium
      - npx playwright test --config=playwright.pwa.config.ts

  test:integration:
    desc: Run PostgreSQL integration tests in an isolated container
    cmds:
      - defer: docker compose -p lansurfer-test -f compose.test.yaml down --volumes --remove-orphans
      - docker compose -p lansurfer-test -f compose.test.yaml up -d --wait
      - LANSURFER_TEST_DATABASE_URL='{{.TEST_DATABASE_URL}}' go test -race -count=1 -tags=integration ./internal/platform/postgres

  generate:
    desc: Generate templates, frontend assets, and typed database code
    cmds:
      - npm ci
      - go generate ./internal/web/branding
      - go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate
      - npm run build
      - go run github.com/sqlc-dev/sqlc/cmd/sqlc@{{.SQLC_VERSION}} generate

  frontend:build:
    desc: Generate templates and production frontend assets
    cmds:
      - npm ci
      - go generate ./internal/web/branding
      - go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate
      - npm run build

  lint:
    desc: Check formatting, modules, Go source, and TypeScript
    cmds:
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "The following files need gofmt:"
          echo "$unformatted"
          exit 1
        fi
      - go mod tidy -diff
      - go vet ./...
      - npm ci
      - npm run typecheck

  db:up:
    desc: Start the development PostgreSQL service
    cmds:
      - docker compose up -d --wait postgres

  db:down:
    desc: Stop development services
    cmds:
      - docker compose down

  admin:users:
    desc: List local LANsurfer users in the running Compose stack
    cmds:
      - docker compose exec lansurfer /lansurfer admin users

  admin:promote:
    desc: Promote a local user to admin in the running Compose stack
    requires:
      vars: [USER_ID]
    cmds:
      - docker compose exec lansurfer /lansurfer admin promote --user-id '{{.USER_ID}}'
