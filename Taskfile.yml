version: "3"

# Optional local configuration (see .env.example). Missing file is not an error;
# variables already set in the process environment take precedence.
dotenv: [".env"]

vars:
  SQLC_VERSION: v1.31.1
  TEST_DATABASE_URL: postgres://lansurfer_test:lansurfer_test@127.0.0.1:55432/lansurfer_test?sslmode=disable

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  dev:
    desc: Generate and run LANsurfer locally with managed or external PostgreSQL
    deps: [generate]
    cmds:
      - |
        set -eu
        if [ -n "${LANSURFER_DATABASE_URL:-}" ]; then
          printf 'Using external PostgreSQL from LANSURFER_DATABASE_URL.\n'
          LANSURFER_OIDC_ISSUER="${LANSURFER_OIDC_ISSUER:-https://auth.convention-x-treme.de/realms/local-dev}" \
          LANSURFER_OIDC_CLIENT_ID="${LANSURFER_OIDC_CLIENT_ID:-lansurfer}" \
            exec go run ./cmd/lansurfer
        fi

        task db:up
        postgres_port="${LANSURFER_POSTGRES_PORT:-5432}"
        printf 'Using managed PostgreSQL at 127.0.0.1:%s.\n' "$postgres_port"
        LANSURFER_DATABASE_URL="postgres://lansurfer:lansurfer@127.0.0.1:${postgres_port}/lansurfer?sslmode=disable" \
        LANSURFER_OIDC_ISSUER="${LANSURFER_OIDC_ISSUER:-https://auth.convention-x-treme.de/realms/local-dev}" \
        LANSURFER_OIDC_CLIENT_ID="${LANSURFER_OIDC_CLIENT_ID:-lansurfer}" \
          exec go run ./cmd/lansurfer

  dev:test:
    desc: Test task dev database selection without Docker or PostgreSQL
    cmds:
      - bash tools/task/test-dev.sh

  run:
    desc: Run LANsurfer with configuration from the environment and optional .env
    cmds:
      - go run ./cmd/lansurfer

  build:
    desc: Build the LANsurfer binary
    deps: [frontend:build]
    cmds:
      - mkdir -p bin
      - go build -trimpath -o bin/lansurfer ./cmd/lansurfer

  release:check:
    desc: Check the GoReleaser OSS configuration (no publishing)
    cmds:
      - goreleaser check

  release:policy:test:
    desc: Verify SemVer parsing and monotonic GHCR alias planning (no publishing)
    cmds:
      - python3 -m unittest discover -s scripts/release -p 'test_release_policy.py' -v
      - python3 -m unittest discover -s scripts/release -p 'test_verify_image_index.py' -v
      - bash -n scripts/release/publish.sh

  release:notes:test:
    desc: Verify automated release notes with disposable Git history (no publishing)
    cmds:
      - bash scripts/release/test-changelog.sh

  release:snapshot:
    desc: Build Linux archives and local multi-arch snapshot images without publishing
    cmds:
      - goreleaser check
      - goreleaser release --snapshot --clean

  test:
    desc: Run shell regression and unit tests with the race detector
    cmds:
      - bash tools/loadtest/coalescing-result.test.sh
      - go test -race ./...

  test:browser:
    desc: Run browser regression tests for rapid interaction and realtime streams
    # The fixture embeds the generated assets at compile time, so the bundle has
    # to be rebuilt before the run or the tests exercise a stale app.ts.
    deps: [frontend:build]
    cmds:
      - npx playwright install --with-deps chromium
      - npx playwright test

  test:pwa:
    desc: Run the focused PWA browser suite (service-worker registration/lifecycle)
    # Same rationale as test:browser: the fixture embeds the compiled bundle,
    # including service-worker.js, at compile time.
    deps: [frontend:build]
    cmds:
      - npx playwright install --with-deps chromium
      - npx playwright test --config=playwright.pwa.config.ts

  test:integration:
    desc: Run PostgreSQL integration tests in an isolated container
    cmds:
      - defer: docker compose -p lansurfer-test -f compose.test.yaml down --volumes --remove-orphans
      - docker compose -p lansurfer-test -f compose.test.yaml up -d --wait
      - LANSURFER_TEST_DATABASE_URL='{{.TEST_DATABASE_URL}}' go test -race -count=1 -tags=integration ./internal/platform/postgres

  generate:
    desc: Generate templates, frontend assets, and typed database code
    cmds:
      - npm ci
      - go generate ./internal/web/branding
      - go run github.com/a-h/templ/cmd/templ@v0.3.1100 generate
      - npm run build
      - go run github.com/sqlc-dev/sqlc/cmd/sqlc@{{.SQLC_VERSION}} generate

  frontend:build:
    desc: Generate templates and production frontend assets
    cmds:
      - npm ci
      - go generate ./internal/web/branding
      - go run github.com/a-h/templ/cmd/templ@v0.3.1100 generate
      - npm run build

  lint:
    desc: Check formatting, modules, Go source, and TypeScript
    cmds:
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "The following files need gofmt:"
          echo "$unformatted"
          exit 1
        fi
      - go mod tidy -diff
      - go vet ./...
      - npm ci
      - npm run typecheck

  db:up:
    desc: Start the development PostgreSQL service
    cmds:
      - docker compose up -d --wait postgres

  db:down:
    desc: Stop development Compose services without removing database data
    cmds:
      - docker compose down

  admin:users:
    desc: List local LANsurfer users from the configured or local development database
    cmds:
      - LANSURFER_DATABASE_URL="${LANSURFER_DATABASE_URL:-postgres://lansurfer:lansurfer@127.0.0.1:${LANSURFER_POSTGRES_PORT:-5432}/lansurfer?sslmode=disable}" go run ./cmd/lansurfer admin users

  admin:promote:
    desc: Promote a local user to admin in the configured or local development database
    requires:
      vars: [USER_ID]
    cmds:
      - LANSURFER_DATABASE_URL="${LANSURFER_DATABASE_URL:-postgres://lansurfer:lansurfer@127.0.0.1:${LANSURFER_POSTGRES_PORT:-5432}/lansurfer?sslmode=disable}" go run ./cmd/lansurfer admin promote --user-id '{{.USER_ID}}'

  loadtest:up:
    desc: Start the isolated local load-test stack (no production data)
    cmds:
      - docker compose -f tools/loadtest/compose.yaml up -d --build --wait

  loadtest:deps:
    desc: Install Node dependencies and Chromium for isolated load-test browser scenarios
    cmds:
      - npm ci
      - npx playwright install --with-deps chromium

  loadtest:seed:
    desc: Create local test-only users and real browser sessions (first run only)
    cmds:
      - go run ./tools/loadtest/seed -users '{{.USERS | default "400"}}' -output "${LANSURFER_LOADTEST_SESSIONS_FILE:-$HOME/lansurfer-loadtest-sessions.jsonl}"

  loadtest:fixtures:
    desc: Create local test Games, follows, Game Requests, and memberships (first run only)
    cmds:
      - go run ./tools/loadtest/fixtures -games '{{.GAMES | default "20"}}' -requests '{{.REQUESTS | default "60"}}' -sessions "${LANSURFER_LOADTEST_SESSIONS_FILE:-$HOME/lansurfer-loadtest-sessions.jsonl}" -output "${LANSURFER_LOADTEST_FIXTURES_FILE:-$HOME/lansurfer-loadtest-fixtures.json}"


  loadtest:fixtures:large:
    desc: Resume the isolated large-v1 dataset into a separate private manifest
    cmds:
      - bash tools/loadtest/guard-compose.sh
      - go run ./tools/loadtest/fixtures -dataset large-v1 -extend-from "${LANSURFER_LOADTEST_FIXTURES_FILE:-$HOME/lansurfer-loadtest-fixtures.json}" -output "${LANSURFER_LOADTEST_LARGE_FIXTURES_FILE:-$HOME/lansurfer-loadtest-fixtures-large.json}" -games '{{.GAMES | default "1000"}}' -requests '{{.REQUESTS | default "5000"}}' -messages-per-request '{{.MESSAGES | default "4"}}' -sessions "${LANSURFER_LOADTEST_SESSIONS_FILE:-$HOME/lansurfer-loadtest-sessions.jsonl}"
  loadtest:prepare:
    desc: Prepare isolated profiling extension, control request, and private metrics key
    cmds:
      - bash tools/loadtest/guard-compose.sh
      - go run ./tools/loadtest/state -mode prepare -sessions "${LANSURFER_LOADTEST_SESSIONS_FILE:-$HOME/lansurfer-loadtest-sessions.jsonl}" -fixtures "${LANSURFER_LOADTEST_FIXTURES_FILE:-$HOME/lansurfer-loadtest-fixtures.json}" -output "$HOME/lansurfer-loadtest-control.json"
      - go run ./tools/loadtest/state -mode metrics-key -output "$HOME/lansurfer-loadtest-metrics-key"
  loadtest:profile:
    desc: Collect isolated Prometheus, PostgreSQL, and container profiles
    cmds:
      - bash tools/loadtest/guard-compose.sh
      - bash tools/loadtest/report/run.sh profile bash -c 'go run ./tools/loadtest/profile -duration "$1" -interval "$2" -metrics-key-file "$HOME/lansurfer-loadtest-metrics-key" -output "$LANSURFER_LOADTEST_REPORT_DIR/profile.jsonl"' profile '{{.DURATION | default "1m"}}' '{{.INTERVAL | default "5s"}}'
  loadtest:run:
    desc: Run authenticated k6 GET load against the isolated Compose network; detail views record recent history
    cmds:
      - BASE_URL='{{.BASE_URL | default "http://lansurfer:8080"}}' SESSION_OFFSET='{{.SESSION_OFFSET | default "0"}}' SEED='{{.SEED | default "139"}}' bash tools/loadtest/report/run.sh http-read bash tools/loadtest/run-http.sh '{{.USERS | default "20"}}' '{{.DURATION | default "1m"}}'

  loadtest:writes:
    desc: Run authenticated create/join/leave/chat k6 load (CSRF-correct) against the isolated stack
    cmds:
      - BASE_URL='{{.BASE_URL | default "http://lansurfer:8080"}}' SESSION_OFFSET='{{.SESSION_OFFSET | default "5"}}' SEED='{{.SEED | default "139"}}' bash tools/loadtest/report/run.sh http-writes bash tools/loadtest/run-http.sh '{{.USERS | default "20"}}' '{{.DURATION | default "1m"}}' writes

  loadtest:race:
    desc: Fire simultaneous CSRF-correct joins at one open Game Request and verify capacity/membership invariants
    requires:
      vars: [REQUEST]
    cmds:
      - go run ./tools/loadtest/race -request '{{.REQUEST}}' -joiners '{{.JOINERS | default "100"}}' -repeat '{{.REPEAT | default "1"}}' -sessions "${LANSURFER_LOADTEST_SESSIONS_FILE:-$HOME/lansurfer-loadtest-sessions.jsonl}"

  loadtest:sse:
    desc: Test concurrent authenticated SSE streams with optional event fan-out
    cmds:
      - go run ./tools/loadtest/sse -clients '{{.USERS | default "20"}}' -duration '{{.DURATION | default "1m"}}' {{if .REQUEST}}-request '{{.REQUEST}}' -trigger '{{.TRIGGER | default "20"}}'{{end}} -trigger-delay '{{.TRIGGER_DELAY | default "0s"}}' -refresh-mode '{{.MODE | default "off"}}' -base-url '{{.BASE_URL | default "http://127.0.0.1:18080"}}' -session-offset '{{.SESSION_OFFSET | default "0"}}' {{if eq (.RECONNECT | default "") "1"}}-allow-reconnect{{end}} {{if eq (.ALLOW_MISSING_EVENTS | default "") "1"}}-allow-missing-events{{end}} {{if eq (.GAME_REQUEST_REFRESH_ONLY | default "") "1"}}-game-request-refresh-only{{end}} -sessions "${LANSURFER_LOADTEST_SESSIONS_FILE:-$HOME/lansurfer-loadtest-sessions.jsonl}"


  loadtest:proxy:
    desc: Start the isolated Compose fault proxy (faults are configured via its control API)
    cmds:
      - bash tools/loadtest/guard-compose.sh
      - docker compose -f tools/loadtest/compose.yaml -f tools/loadtest/compose.chaos.yaml up -d --build --wait proxy

  loadtest:browser:
    desc: Run the isolated authenticated Chromium and SSE browser smoke test
    cmds:
      - bash tools/loadtest/guard-compose.sh
      - npx playwright test --config=tools/loadtest/playwright.config.ts

  loadtest:browser-calibration:
    desc: Compare real Playwright refresh behavior with simulated SSE clients
    requires:
      vars: [REQUEST]
    cmds:
      - BASE_URL='{{.BASE_URL | default "http://127.0.0.1:18080"}}' REQUEST='{{.REQUEST}}' SIMULATED_USERS='{{.SIMULATED_USERS | default "120"}}' SIMULATED_SESSION_OFFSET='{{.SIMULATED_SESSION_OFFSET}}' BROWSER_CLIENTS='{{.BROWSER_CLIENTS | default "5"}}' DURATION='{{.DURATION | default "75s"}}' TRIGGER='{{.TRIGGER | default "20"}}' TRIGGER_INTERVAL='{{.TRIGGER_INTERVAL | default "500ms"}}' TRIGGER_DELAY='{{.TRIGGER_DELAY}}' ALLOW_RECONNECT='{{.ALLOW_RECONNECT | default "0"}}' ALLOW_MISSING_EVENTS='{{.ALLOW_MISSING_EVENTS | default "0"}}' VIEW='{{.VIEW | default "mixed"}}' FILTER_GAME='{{.FILTER_GAME | default "Warcraft III"}}' REFRESH_MODE='{{.REFRESH_MODE}}' COALESCING='{{.COALESCING | default "0"}}' PROBE='{{.PROBE | default "0"}}' WRITERS='{{.WRITERS | default "0"}}' WRITER_SESSION_OFFSET='{{.WRITER_SESSION_OFFSET}}' WRITER_DURATION='{{.WRITER_DURATION | default "90s"}}' PROFILE_DURATION='{{.PROFILE_DURATION | default "90s"}}' node tools/loadtest/browser-calibration.mjs
  loadtest:calibrate:
    desc: Run the ordered 120/400 browser-like and worst-case calibration matrix
    requires:
      vars: [REQUEST]
    cmds:
      - bash tools/loadtest/guard-compose.sh
      - docker compose -f tools/loadtest/compose.yaml -f tools/loadtest/compose.chaos.yaml up -d --build --wait proxy
      - PHASE=calibrate REQUEST='{{.REQUEST}}' USERS='{{.USERS | default "120"}}' BROWSERS='{{.BROWSERS | default "5"}}' DURATION='{{.DURATION | default "90s"}}' MODE='{{.MODE}}' bash tools/loadtest/report/run.sh calibrate node tools/loadtest/run-phase2.mjs

  loadtest:coalescing:down:
    desc: Stop one paired SSE-refresh workspace and keep its database volume
    requires:
      vars: [WORKSPACE]
    cmds:
      - WORKSPACE='{{.WORKSPACE}}' bash tools/loadtest/coalescing.sh down

  loadtest:coalescing:prepare:
    desc: Prepare private paired SSE-refresh load-test snapshots and images
    requires:
      vars: [WORKSPACE, PRODUCT_REVISION, HARNESS_REVISION]
    cmds:
      - WORKSPACE='{{.WORKSPACE}}' PRODUCT_REVISION='{{.PRODUCT_REVISION}}' HARNESS_REVISION='{{.HARNESS_REVISION}}' bash tools/loadtest/coalescing.sh prepare

  loadtest:coalescing:
    desc: Run one isolated paired SSE-refresh measurement cell (small profile by default)
    requires:
      vars: [WORKSPACE, PRODUCT_REVISION, HARNESS_REVISION, VARIANT, REPETITION]
    cmds:
      - WORKSPACE='{{.WORKSPACE}}' PRODUCT_REVISION='{{.PRODUCT_REVISION}}' HARNESS_REVISION='{{.HARNESS_REVISION}}' VARIANT='{{.VARIANT}}' REPETITION='{{.REPETITION}}' LOADTEST_PROFILE='{{.PROFILE | default "small"}}' ALLOW_400_CLIENT_PROFILE='{{.ALLOW_400_CLIENT_PROFILE | default "0"}}' bash tools/loadtest/coalescing.sh run
  loadtest:loss:
    desc: Prove persistent state survives deliberately lost SSE signals
    requires:
      vars: [REQUEST]
    cmds:
      - bash tools/loadtest/guard-compose.sh
      - docker compose -f tools/loadtest/compose.yaml -f tools/loadtest/compose.chaos.yaml up -d --build --wait proxy
      - PHASE=loss REQUEST='{{.REQUEST}}' USERS='{{.USERS | default "120"}}' BROWSERS='{{.BROWSERS | default "5"}}' DURATION='{{.DURATION | default "90s"}}' bash tools/loadtest/report/run.sh loss node tools/loadtest/run-phase2.mjs

  loadtest:chaos:
    desc: Run cut, offline, delay, or packet-loss recovery scenarios through the isolated proxy
    requires:
      vars: [REQUEST, SCENARIO]
    cmds:
      - bash tools/loadtest/guard-compose.sh
      - docker compose -f tools/loadtest/compose.yaml -f tools/loadtest/compose.chaos.yaml up -d --build --wait proxy
      - REQUEST='{{.REQUEST}}' SCENARIO='{{.SCENARIO}}' USERS='{{.USERS | default "120"}}' BROWSERS='{{.BROWSERS | default "5"}}' DURATION='{{.DURATION | default "180s"}}' DELAY_MS='{{.DELAY_MS | default "200"}}' bash tools/loadtest/report/run.sh chaos node tools/loadtest/run-chaos.mjs

  loadtest:soak:
    desc: Run staged mixed HTTP writes, SSE streams, five-browser identities, profiling, cooldown, and audit
    cmds:
      - bash tools/loadtest/guard-compose.sh
      - BROWSERS='{{.BROWSERS | default "5"}}' LANSURFER_LOADTEST_FIXTURES_FILE="${LANSURFER_LOADTEST_FIXTURES_FILE:-{{if eq (.DATASET | default "") "large"}}$HOME/lansurfer-loadtest-fixtures-large.json{{else}}$HOME/lansurfer-loadtest-fixtures.json{{end}}}" bash tools/loadtest/report/run.sh soak bash tools/loadtest/soak.sh '{{.USERS | default "120"}}' '{{.DURATION | default "2h"}}'

  loadtest:scan:
    desc: Count private session tokens or metrics keys in a report path without printing them
    requires:
      vars: [REPORT_PATH]
    cmds:
      - go run ./tools/loadtest/report -mode scan -sessions "${LANSURFER_LOADTEST_SESSIONS_FILE:-$HOME/lansurfer-loadtest-sessions.jsonl}" -metrics-key-file "${LANSURFER_LOADTEST_METRICS_KEY_FILE:-$HOME/lansurfer-loadtest-metrics-key}" -path '{{.REPORT_PATH}}'

  loadtest:report:
    desc: List private load-test reports and run bundles
    cmds:
      - ls -lh "${LANSURFER_LOADTEST_REPORT_ROOT:-$HOME/lansurfer-loadtest-reports}"

  loadtest:down:
    desc: Stop the isolated load-test stack including the chaos proxy (keep its database volume)
    cmds:
      # The proxy comes from compose.chaos.yaml, so it is an orphan of this
      # project here; --remove-orphans is scoped to project lansurfer-loadtest.
      - docker compose -p lansurfer-loadtest -f tools/loadtest/compose.yaml down --remove-orphans
